  <line x1="380" y1="204" x2="652" y2="204" stroke="#FF4500" stroke-width="0.3" stroke-opacity="0.4"/>
  <text x="420" y="220" font-family="JetBrains Mono, monospace" font-size="9" fill="#FF4500" font-weight="700" text-anchor="middle">2+</text>
  <text x="420" y="232" font-family="JetBrains Mono, monospace" font-size="6" fill="#888780" text-anchor="middle">YEARS EXP</text>
  <text x="516" y="220" font-family="JetBrains Mono, monospace" font-size="9" fill="#FF4500" font-weight="700" text-anchor="middle">10+</text>
  <text x="516" y="232" font-family="JetBrains Mono, monospace" font-size="6" fill="#888780" text-anchor="middle">PROJECTS</text>
  <text x="612" y="220" font-family="JetBrains Mono, monospace" font-size="9" fill="#FF4500" font-weight="700" text-anchor="middle">5+</text>
  <text x="612" y="232" font-family="JetBrains Mono, monospace" font-size="6" fill="#888780" text-anchor="middle">CERTS</text>

