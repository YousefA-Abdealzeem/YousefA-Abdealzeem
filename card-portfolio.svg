  <text x="388" y="109" font-family="JetBrains Mono, monospace" font-size="10" fill="#FF4500" font-weight="700">Yousef Alian</text>
  <text x="388" y="122" font-family="JetBrains Mono, monospace" font-size="8" fill="#B4B2A9">Frontend Dev</text>

