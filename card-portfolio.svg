<svg width="100%" viewBox="0 0 680 280" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>My Portfolio — Yousef Alian</title>
  <desc>Project card for the Angular 17 portfolio website</desc>
  <defs>
    <clipPath id="imgClip">
      <rect x="380" y="24" width="272" height="232" rx="8"/>
